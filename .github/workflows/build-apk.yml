name: Build FITFURY ResearchApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ChatGPT ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITFURY-ResearchApp-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
