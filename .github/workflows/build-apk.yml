name: Build FITFURY ResearchApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract ChatGPT ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Build APK
        run: |
          ROOT_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
          if [ -z "$ROOT_FILE" ]; then
            echo "settings.gradle.kts not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$ROOT_FILE")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITFURY-ResearchApp-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
